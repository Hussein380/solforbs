name: VPS Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  test_and_lint:
    name: Run Tests & Lint (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check TypeScript Errors
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  deploy:
    name: Deploy to VPS (CD)
    needs: test_and_lint # <-- INDUSTRY STANDARD: Prevent deployment if CI fails!
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/solforbs
            git pull origin main
            npm install
            npm run build
            pm2 restart solforbs-web
